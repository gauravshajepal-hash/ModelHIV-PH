[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phase3-dynamic"
version = "0.1.0"
description = "Isolated TR-V3 autoresearch sandbox for dynamic blocked-time HIV transition benchmarks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.scripts]
phase3-dynamic = "phase3_dynamic.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
